services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: skala-backend:1.0
    ports:
      - 9090:8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: skala-frontend:1.0
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf