<!-- [과제] 회원가입 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
</head>
<body>
  <h1>👤 회원가입</h1>
  <p>SKALA-FRONT 회원가입을 환영합니다.</p>
  <hr>

  <form action="signUpResult.html" method="get">

    <fieldset>
      <legend>계정 정보</legend>
      <p>
        <label for="userId">아이디: </label>
        <input type="text" id="userId" name="userId" minlength="4" maxlength="15" required placeholder="4~15자 영문/숫자" value="Chaehyunli">
        <small>(필수)</small>
      </p>
      <p>
        <label for="userPw">비밀번호: </label>
        <input type="password" id="userPw" name="userPw" minlength="8" required placeholder="8자 이상 입력">
        <small>(필수)</small>
      </p>
      <p>
        <label for="userEmail">이메일: </label>
        <input type="text" id="userEmail" name="userEmail" placeholder="example" value="chaehyun010104">
        @
        <select name="emailDomain">
          <option value="gmail.com" selected>gmail.com</option>
          <option value="naver.com">naver.com</option>
          <option value="daum.net">daum.net</option>
          <option value="direct">직접 입력</option>
        </select>
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend>개인 프로필 정보</legend>
      <p>
        <label for="userName">이름: </label>
        <input type="text" id="userName" name="userName" required value="임채현">
      </p>
      <p>
        <label for="userBirth">생년월일: </label>
        <input type="date" id="userBirth" name="userBirth">
      </p>
      <p>
        성별:
        <label><input type="radio" name="gender" value="male"> 남성</label>
        <label><input type="radio" name="gender" value="female"> 여성</label>
        <label><input type="radio" name="gender" value="none" checked> 선택안함</label>
      </p>
      <p>
        관심 분야 (중복 선택 가능): <br>
        <label><input type="checkbox" name="interest" value="frontend" checked> 웹 프론트엔드 (React/HTML)</label><br>
        <label><input type="checkbox" name="interest" value="uiux"> UI/UX 디자인 표준</label><br>
        <label><input type="checkbox" name="interest" value="backend" checked> 백엔드 & 데이터베이스 (Spring Boot/FastAPI)</label><br>
        <label><input type="checkbox" name="interest" value="devops" checked> 클라우드 & 인프라 (Docker/AWS/GCP)</label>
      </p>
      <p>
        <label for="joinPath">가입 경로: </label>
        <select id="joinPath" name="joinPath">
          <option value="" disabled>-- 선택해 주세요 --</option>
          <option value="search" selected>인터넷 검색</option>
          <option value="friend">지인 추천</option>
          <option value="sns">SNS 광고</option>
          <option value="etc">기타</option>
        </select>
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend>자기소개</legend>
      <p>
        <label for="intro">나를 표현하는 한 줄 소개 또는 가입 인사:</label><br>
        <textarea id="intro" name="intro" rows="5" cols="50" placeholder="여기에 내용을 입력하세요 (최대 200자)">SKALA 4기 임채현입니다. AI 풀스택 개발을 공부하며 PETNER, Searchive, Masil 같은 프로젝트를 만들어왔습니다. 잘 부탁드립니다!</textarea>
      </p>
    </fieldset>

    <br>

    <input type="submit" value="동의하고 회원가입">
    <input type="reset" value="다시 작성">

  </form>

  <!-- 지시되지 않은 추가 실습: 가입 전에도 확인할 수 있도록 나의 실제 활동 링크를 안내 -->
  <h2>🔗 가입 전에 미리 살펴보기</h2>
  <ul>
    <li><a href="https://github.com/Chaehyunli" target="_blank">GitHub: github.com/Chaehyunli</a></li>
    <li><a href="https://ch010104.tistory.com/" target="_blank">개발 블로그: ch010104.tistory.com</a></li>
  </ul>
</body>
</html>
