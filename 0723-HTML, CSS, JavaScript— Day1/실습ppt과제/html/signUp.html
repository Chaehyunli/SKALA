<!-- [과제] 회원가입 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
  <header>
    <h1>👤 회원가입</h1>
    <nav>
      <a href="index.html">🏠 홈</a>
      <a href="myProfile.html">🙋 프로필</a>
      <a href="myClass.html">📅 수업</a>
      <a href="myHoliday.html">🏖️ 휴일</a>
      <a href="myTrip.html">🌍 여행앨범</a>
      <a href="signUp.html">📝 회원가입</a>
    </nav>
  </header>

  <main>
  <p>SKALA-FRONT 회원가입을 환영합니다.</p>
  <hr>

  <form action="signUpResult.html" method="get">

    <fieldset>
      <legend>계정 정보</legend>
      <p>
        <label for="userId">아이디: </label>
        <input type="text" id="userId" name="userId" minlength="4" maxlength="15" required placeholder="4~15자 영문/숫자">
        <small>(필수)</small>
      </p>
      <p>
        <label for="userPw">비밀번호: </label>
        <input type="password" id="userPw" name="userPw" minlength="8" required placeholder="8자 이상 입력">
        <small>(필수)</small>
      </p>
      <p>
        <label for="userEmail">이메일: </label>
        <input type="text" id="userEmail" name="userEmail" placeholder="example">
        @
        <select name="emailDomain">
          <option value="" disabled selected>-- 선택 --</option>
          <option value="gmail.com">gmail.com</option>
          <option value="naver.com">naver.com</option>
          <option value="daum.net">daum.net</option>
          <option value="direct">직접 입력</option>
        </select>
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend>개인 프로필 정보</legend>
      <p>
        <label for="userName">이름: </label>
        <input type="text" id="userName" name="userName" required>
      </p>
      <p>
        <label for="userBirth">생년월일: </label>
        <input type="date" id="userBirth" name="userBirth">
      </p>
      <p>
        성별:
        <label><input type="radio" name="gender" value="male"> 남성</label>
        <label><input type="radio" name="gender" value="female"> 여성</label>
        <label><input type="radio" name="gender" value="none"> 선택안함</label>
      </p>
      <p>
        관심 분야 (중복 선택 가능): <br>
        <label><input type="checkbox" name="interest" value="frontend"> 웹 프론트엔드 (React/HTML)</label><br>
        <label><input type="checkbox" name="interest" value="uiux"> UI/UX 디자인 표준</label><br>
        <label><input type="checkbox" name="interest" value="backend"> 백엔드 & 데이터베이스</label><br>
        <label><input type="checkbox" name="interest" value="devops"> 클라우드 & 인프라</label>
      </p>
      <p>
        <label for="joinPath">가입 경로: </label>
        <select id="joinPath" name="joinPath">
          <option value="" disabled selected>-- 선택해 주세요 --</option>
          <option value="search">인터넷 검색</option>
          <option value="friend">지인 추천</option>
          <option value="sns">SNS 광고</option>
          <option value="etc">기타</option>
        </select>
      </p>
    </fieldset>

    <br>

    <!-- 지시되지 않은 추가 실습: 실습 예시에는 없던 개발자 전용 정보 입력란 -->
    <fieldset>
      <legend>개발자 정보</legend>
      <p>
        <label for="githubUrl">GitHub 프로필 URL: </label>
        <input type="url" id="githubUrl" name="githubUrl" placeholder="https://github.com/아이디" size="35">
      </p>
      <p>
        <label for="blogUrl">개발 블로그 URL: </label>
        <input type="url" id="blogUrl" name="blogUrl" placeholder="https://내블로그주소" size="35">
      </p>
      <p>
        사용 가능 언어 (중복 선택 가능): <br>
        <label><input type="checkbox" name="lang" value="java"> Java</label>
        <label><input type="checkbox" name="lang" value="python"> Python</label>
        <label><input type="checkbox" name="lang" value="javascript"> JavaScript</label>
        <label><input type="checkbox" name="lang" value="kotlin"> Kotlin</label>
        <label><input type="checkbox" name="lang" value="cpp"> C++</label>
      </p>
      <p>
        <label for="career">개발 경력: </label>
        <select id="career" name="career">
          <option value="" disabled selected>-- 선택해 주세요 --</option>
          <option value="student">학생 / 부트캠프 수강 중</option>
          <option value="junior">1~3년차</option>
          <option value="mid">4~7년차</option>
          <option value="senior">8년차 이상</option>
        </select>
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend>자기소개</legend>
      <p>
        <label for="intro">나를 표현하는 한 줄 소개 또는 가입 인사:</label><br>
        <textarea id="intro" name="intro" rows="5" cols="50" placeholder="여기에 내용을 입력하세요 (최대 200자)"></textarea>
      </p>
    </fieldset>

    <br>

    <input type="submit" value="동의하고 회원가입">
    <input type="reset" value="다시 작성">

  </form>
  </main>

  <footer class="site-footer">
    <p>🔗 GitHub: <a href="https://github.com/Chaehyunli" target="_blank">github.com/Chaehyunli</a> · ✍️ 개발 블로그: <a href="https://ch010104.tistory.com/" target="_blank">ch010104.tistory.com</a></p>
  </footer>
  </div>
</body>
</html>
