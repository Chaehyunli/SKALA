server:
  port: 8082

spring:
  application:
    name: course-service

  profiles:
    # `./gradlew bootRun` from a service directory uses the local Docker dependencies.
    default: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
