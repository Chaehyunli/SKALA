# Revenue Analyst Agent 권한 파일

agent: REVENUE_ANALYST
name: Revenue Analyst Agent
task: 고객·매출 분석
selectable: true
description: >
  CRM 고객 데이터와 매출 실적을 함께 분석해 이탈 위험 고객, 매출 추이,
  세그먼트별 실적을 도출한다. 분석 결과를 바탕으로 후속 커뮤니케이션
  초안까지 작성할 수 있다.
typicalTasks:
  - 이탈 가능성이 높은 고객 분석
  - 분기별 매출 추이 정리
  - 고객 세그먼트별 실적 비교
  - 영업 파이프라인 현황 요약

groups:

  CUSTOMER:
    displayName: 고객
    description: CRM 고객 데이터의 조회, 수정, 반출에 관한 권한
    permissions:

      CUSTOMER_READ:
        label: CRM 고객정보 조회
        description: >
          고객 이름, 연락처, 계약 상태, 최근 활동 이력을 읽는다.
          고객 데이터를 변경하지 않는다.
        risk: LOW
        reversible: true
        externalImpact: false
        humanReviewRequired: false
        containsPersonalData: true
        recommendedTtlHours: 24

      CUSTOMER_SEGMENT_READ:
        label: 고객 세그먼트 조회
        description: >
          고객 등급, 산업군, 이탈 위험도 등 분류 지표를 읽는다.
          개별 고객의 연락처는 포함하지 않는다.
        risk: LOW
        reversible: true
        externalImpact: false
        humanReviewRequired: false
        containsPersonalData: false
        recommendedTtlHours: 24

      CUSTOMER_UPDATE:
        label: CRM 고객정보 수정
        description: >
          고객 레코드의 필드 값을 변경한다. 변경 이력은 남지만
          이전 값을 자동으로 복원하지 않는다.
        risk: HIGH
        reversible: false
        externalImpact: false
        humanReviewRequired: true
        containsPersonalData: true
        recommendedTtlHours: 8

      CUSTOMER_DELETE:
        label: CRM 고객정보 삭제
        description: >
          고객 레코드를 삭제한다. 연결된 활동 이력까지 함께 사라지며
          복구할 수 없다. 업무에 삭제가 명시적으로 요구된 경우에만
          필요로 판단한다.
        risk: CRITICAL
        reversible: false
        externalImpact: false
        humanReviewRequired: true
        containsPersonalData: true
        recommendedTtlHours: 2

      CUSTOMER_EXPORT:
        label: 고객 목록 반출
        description: >
          고객 목록을 파일로 내려받는다. 개인정보가 포함된 상태로
          사외 반출이 가능해지므로 통제 범위를 벗어난다.
        risk: CRITICAL
        reversible: false
        externalImpact: true
        humanReviewRequired: true
        containsPersonalData: true
        recommendedTtlHours: 2

  REVENUE:
    displayName: 매출
    description: 매출 실적 데이터의 조회와 반출에 관한 권한
    permissions:

      REVENUE_READ:
        label: 매출 데이터 조회
        description: >
          기간별·고객별 매출 실적 파일과 집계 데이터를 읽는다.
          데이터를 변경하거나 외부로 내보내지 않는다.
        risk: LOW
        reversible: true
        externalImpact: false
        humanReviewRequired: false
        containsPersonalData: false
        recommendedTtlHours: 24

      REVENUE_FORECAST_READ:
        label: 매출 예측 조회
        description: >
          영업 파이프라인 기반 매출 예측치와 확정 전 계약 정보를 읽는다.
          공시 전 정보가 포함될 수 있다.
        risk: MEDIUM
        reversible: true
        externalImpact: false
        humanReviewRequired: false
        containsPersonalData: false
        recommendedTtlHours: 8

      REVENUE_EXPORT:
        label: 매출 데이터 반출
        description: >
          매출 실적을 파일로 내려받는다. 사외 반출이 가능해지며
          공시 전 재무 정보가 포함될 수 있다.
        risk: CRITICAL
        reversible: false
        externalImpact: true
        humanReviewRequired: true
        containsPersonalData: false
        recommendedTtlHours: 2

  ANALYSIS:
    displayName: 분석 결과
    description: 분석 결과 저장과 공유에 관한 권한
    permissions:

      ANALYSIS_REPORT_CREATE:
        label: 분석 리포트 작성
        description: >
          분석 결과를 리포트 초안으로 저장한다. 공유 범위는
          작성자 본인으로 제한되며 자동 배포되지 않는다.
        risk: MEDIUM
        reversible: true
        externalImpact: false
        humanReviewRequired: true
        containsPersonalData: false
        recommendedTtlHours: 24
