# Used by default when Course service runs directly on a developer machine.
# The repository root .env stays untracked and supplies MYSQL_USER/MYSQL_PASSWORD.
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mariadb://localhost:3379/lecture_db
    username: ${MYSQL_USER:manager}
    password: ${MYSQL_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
          issuer-uri: http://localhost:9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

service:
  user-service:
    url: http://localhost:8081

# Ollama runs natively on the developer machine, not in Docker.
llm:
  base-url: http://localhost:11434/api/chat
  model: qwen3.5:4b
  connect-timeout-ms: 5000
  read-timeout-ms: 120000
