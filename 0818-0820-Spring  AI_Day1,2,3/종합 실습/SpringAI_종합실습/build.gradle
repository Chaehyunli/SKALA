plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skala'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// 편집기·OS 가 달라도 한글 주석·프롬프트가 깨지지 않게 인코딩을 고정한다.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { systemProperty 'file.encoding', 'UTF-8' }
tasks.named('bootRun') { jvmArgs = ['-Dfile.encoding=UTF-8'] }

repositories { mavenCentral() }

ext { springAiVersion = '1.1.8' }

dependencies {
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'   // .env 파일을 Spring Environment로 읽어들인다(SpringApplicationRunListener)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // MeterRegistry, /actuator/metrics
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'      // pgvector·JDBC 대화기억이 JdbcTemplate을 쓴다
    implementation 'org.springframework.boot:spring-boot-starter-mail'      // 컴플라이언스 신고 메일 발송
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'   // Swagger UI

    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-rag'                          // RetrievalAugmentationAdvisor
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'   // 대화기억 재시작에도 유지

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports { mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}" }
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'live' }   // 실제 외부 API를 호출하는 연동 테스트는 기본 test에서 제외
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

// Finnhub·Frankfurter·Gmail을 실제로 호출하는 연동 테스트 — 필요할 때만 수동 실행: ./gradlew liveTest
tasks.register('liveTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}
