spring:
  application:
    name: day3

  ai:
    openai:
      # 키는 소스에 넣지 않는다.  export OPENAI_API_KEY="sk-..."
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none

management:
  endpoints:
    web:
      exposure:
        include: metrics

app:
  # Lab3 환불 승인 API 게이트 — 운영 배포 시 반드시 바꿔서 넣는다.
  admin-key: ${ADMIN_KEY:changeme}

logging:
  level:
    com.skala: DEBUG
