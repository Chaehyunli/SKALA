plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skala'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// 편집기·OS 가 달라도 한글 주석·프롬프트가 깨지지 않게 인코딩을 고정한다.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { systemProperty 'file.encoding', 'UTF-8' }
tasks.named('bootRun') { jvmArgs = ['-Dfile.encoding=UTF-8'] }

repositories { mavenCentral() }

ext { springAiVersion = '1.1.8' }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // MeterRegistry, /actuator/metrics
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'   // Swagger UI
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-vector-store'   // SimpleVectorStore
    implementation 'org.springframework.ai:spring-ai-rag'   // RetrievalAugmentationAdvisor

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports { mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}" }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'eval', project.hasProperty('eval')   // ./gradlew test -Peval 로만 모델 호출 테스트 실행
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true                        // log.info/log.warn 이 콘솔에 그대로 보여야 실패 원인을 읽는다
    }
}
