# ============================================================
# STEP 02 - Structured Output
# 설정은 STEP 01과 동일하다. 구조화 출력은 코드(entity())로 제어하며
# 별도 설정이 필요 없다.
# ============================================================
server:
  port: 8102

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # 참고: 구조화 출력의 정확도는 모델 성능에 좌우된다.
        # 스키마 검증 실패(재시도)가 잦다면 상위 모델로 올려본다.
        model: gpt-5-mini
