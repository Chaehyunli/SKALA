// ============================================================
// 루트 빌드 스크립트 (멀티 모듈 공통 설정)
//
// step01 ~ step10 각 모듈은 자기 build.gradle에 '의존성'만 적는다.
// 플러그인/자바 버전/테스트 설정 같은 공통 규칙은 여기서 한 번에 정한다.
// ============================================================

plugins {
    // apply false : 루트 프로젝트 자체에는 플러그인을 적용하지 않고
    // '버전만 선언'해 둔다. 실제 적용은 아래 subprojects 블록에서 한다.
    // 루트에는 소스가 없으므로 부팅 가능한 jar를 만들 필요가 없기 때문이다.
    id 'org.springframework.boot' version '4.0.7' apply false

    // 의존성 버전을 Spring Boot BOM에 맞춰 자동 정렬해 주는 플러그인.
    // 덕분에 각 모듈에서 'spring-boot-starter-web' 처럼 버전 없이 쓸 수 있다.
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

// allprojects : 루트 + 모든 하위 모듈에 적용
allprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        // Spring AI 2.0 정식 릴리스는 Maven Central에서 받을 수 있다.
        // (마일스톤/스냅샷 버전을 쓸 때는 Spring 저장소를 추가해야 한다)
        mavenCentral()
    }
}

// subprojects : 하위 모듈(step01~step10)에만 적용
subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            // Spring Boot 4 / Spring AI 2 의 요구 버전.
            // toolchain을 쓰면 로컬 JDK 버전이 달라도 Gradle이
            // JDK 21을 찾아(없으면 내려받아) 컴파일해 준다.
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test).configureEach {
        // JUnit 5(Jupiter)로 테스트를 실행한다. STEP 09의 평가 테스트가 이 설정을 쓴다.
        useJUnitPlatform()
    }
}
