# ============================================================
# STEP 01 - 기본 Chat 설정
# ============================================================
server:
  # 각 STEP이 동시에 떠도 충돌하지 않도록 포트를 81XX로 나눠 쓴다 (STEP 01 → 8101)
  port: 8101

spring:
  ai:
    openai:
      # ${...} : 환경변수 치환. API 키를 소스에 하드코딩하면 Git에 유출되므로
      # 반드시 환경변수로 주입한다.
      #   export OPENAI_API_KEY=sk-...
      # 환경변수가 없으면 애플리케이션 기동 시점에 실패한다.
      api-key: ${OPENAI_API_KEY}
      chat:
        # 사용할 채팅 모델. 이 한 줄만 바꾸면 코드 수정 없이 모델을 교체할 수 있다.
        # (mini 계열은 저렴하고 빠르므로 학습·개발용으로 적합하다)
        model: gpt-5-mini
